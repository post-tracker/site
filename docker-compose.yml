services:
  # --- Infrastructure ---

  mysql:
    image: mysql:8
    labels:
      # Never auto-update infra: a surprise image swap risks data/connection loss.
      - "dockhand.update=false"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devtracker}
      MYSQL_DATABASE: ${DB_NAME:-developertracker}
      MYSQL_USER: ${DB_USERNAME:-devtracker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devtracker}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    labels:
      # Never auto-update infra: a surprise image swap risks data/connection loss.
      - "dockhand.update=false"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- HTTP Services ---

  rest-api:
    image: ghcr.io/post-tracker/rest-api:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Default to production: rest-api/config.json's development pool caps DB
      # connections at 5, which a burst of concurrent reads (e.g. the site build)
      # exhausts -> "ResourceRequest timed out". Production raises pool.max to 40.
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-developertracker}
      DB_USERNAME: ${DB_USERNAME:-devtracker}
      DB_PASSWORD: ${DB_PASSWORD:-devtracker}
      API_TOKENS: ${API_TOKENS:-{}}
      API_TOKEN: ${API_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy

  admin:
    image: ghcr.io/post-tracker/admin:latest
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      API_TOKEN: ${ADMIN_API_TOKEN:-}
      ACCESS_USERNAME: ${ACCESS_USERNAME:-admin}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-admin}
      REDIS_URL: redis://redis:6379
      QUEUE_NAMES: ${ADMIN_QUEUE_NAMES:-posts,users}
    depends_on:
      - rest-api
      - redis

  # # chieftain:
  # #   image: ghcr.io/post-tracker/chieftain:latest
  # #   ports:
  # #     - "4002:3000"
  # #   environment:
  # #     REDIS_HOST: redis
  # #     REDIS_PORT: 6379
  # #     REDIS_PASSWORD: ""
  # #   depends_on:
  # #     redis:
  # #       condition: service_healthy

  # # --- Queue Workers ---

  peon:
    image: ghcr.io/post-tracker/peon:latest
    environment:
      REDIS_URL: redis://redis:6379
      API_TOKEN: ${API_TOKEN:-}
      # Per-service Reddit OAuth app so each can have its own credentials / rate budget.
      REDDIT_CLIENT_ID: ${PEON_REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${PEON_REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${PEON_REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${PEON_REDDIT_PASSWORD:-}
      REDDIT_USER_AGENT: ${PEON_REDDIT_USER_AGENT:-}
    depends_on:
      redis:
        condition: service_healthy
      rest-api:
        condition: service_started

  # grunt consumes the 'users' queue, discovers Reddit posts, and enqueues them
  # onto the 'posts' queue for peon to parse + save.
  grunt:
    image: ghcr.io/post-tracker/grunt:latest
    environment:
      REDIS_URL: redis://redis:6379
      API_TOKEN: ${API_TOKEN:-}
      # Per-service Reddit OAuth app so each can have its own credentials / rate budget.
      REDDIT_CLIENT_ID: ${GRUNT_REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${GRUNT_REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${GRUNT_REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${GRUNT_REDDIT_PASSWORD:-}
      REDDIT_USER_AGENT: ${GRUNT_REDDIT_USER_AGENT:-}
    depends_on:
      redis:
        condition: service_healthy
      rest-api:
        condition: service_started

  # # --- Indexers & Finders ---

  indexer:
    image: ghcr.io/post-tracker/indexer:latest
    environment:
      API_TOKEN: ${API_TOKEN:-}
      LIMIT_SERVICE: ${LIMIT_SERVICE:-}
    depends_on:
      rest-api:
        condition: service_healthy

  # Finder runs continuously, scheduling its own work internally on a 6h cycle.
  finder:
    image: ghcr.io/post-tracker/finder:latest
    environment:
      API_TOKEN: ${API_TOKEN:-}
      RUN_SCHEDULE: ${FINDER_RUN_SCHEDULE:-}
      # Per-service Reddit OAuth app so each can have its own credentials / rate budget.
      REDDIT_CLIENT_ID: ${FINDER_REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${FINDER_REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${FINDER_REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${FINDER_REDDIT_PASSWORD:-}
      REDDIT_USER_AGENT: ${FINDER_REDDIT_USER_AGENT:-}
    restart: unless-stopped
    depends_on:
      rest-api:
        condition: service_healthy

  # # game-finder:
  # #   image: ghcr.io/post-tracker/game-finder:latest
  # #   depends_on:
  # #     - rest-api

  # # ludeon-finder:
  # #   image: ghcr.io/post-tracker/ludeon-finder:latest

  # --- Queue Setup ---

  # queue-users runs continuously, re-syncing Reddit accounts and (re)registering
  # repeatable 'users' jobs on a 6h cycle (repeatables persist in Redis between runs).
  queue-users:
    image: ghcr.io/post-tracker/queue-users:latest
    environment:
      REDIS_URL: redis://redis:6379
      API_TOKEN: ${API_TOKEN:-}
      RUN_SCHEDULE: ${QUEUE_USERS_RUN_SCHEDULE:-}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rest-api:
        condition: service_healthy

  # Reddit ingestion moved to the queue-users -> grunt -> peon pipeline; queuer retired.

  # --- Utilities ---

  # Turtle runs continuously, regenerating RSS feeds on a 10m cycle.
  turtle:
    image: ghcr.io/post-tracker/turtle:latest
    environment:
      API_TOKEN: ${API_TOKEN:-}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      # R2 credentials enable the dual-write of RSS/sitemaps to the Cloudflare
      # R2 bucket the Pages site serves feeds from. Without these two, turtle
      # falls back to S3-only and the R2 feeds go stale. Bucket + account id
      # default correctly in turtle/r2.js, so only the keys are needed here.
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    depends_on:
      rest-api:
        condition: service_healthy

  # twitch-lurker:
  #   image: ghcr.io/post-tracker/twitch-lurker:latest
  #   environment:
  #     API_TOKEN: ${API_TOKEN:-}
  #     TWITCH_CLIENTID: ${TWITCH_CLIENTID:-}
  #     TWITCH_USERNAME: ${TWITCH_USERNAME:-}
  #     TWITCH_OAUTH: ${TWITCH_OAUTH:-}

volumes:
  mysql-data:
  redis-data:

networks:
  default:
    name: post-tracker
